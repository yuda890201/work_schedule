<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>シフト割当管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        <div class="flex justify-between items-center">
            <h2 class="text-2xl font-bold text-slate-800">シフト割当管理</h2>
            <div class="flex items-center gap-4">
                <span id="current-store-display" class="font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full text-sm"></span>
                <button onclick="window.location.href='dashboard.html'" class="text-slate-500 hover:text-slate-900 font-bold">ダッシュボードへ</button>
            </div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <label class="font-bold text-slate-700 text-sm">対象シフト:</label>
                <select id="shift-select" onchange="changeShift(this.value)" class="p-2 border rounded-lg font-bold bg-slate-50 text-slate-800"></select>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openShiftModal()" class="px-4 py-2 bg-blue-600 text-white font-bold rounded-lg text-sm hover:bg-blue-700 flex items-center gap-1">
                    <i data-lucide="plus" class="w-4 h-4"></i> 新規シフト追加
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-1 bg-white p-4 rounded-xl shadow-sm border h-[calc(100vh-230px)] flex flex-col">
                <h3 class="font-bold mb-4 text-slate-700">タスクマスター</h3>
                <div class="flex gap-2 mb-4 overflow-x-auto pb-2 shrink-0" id="category-tabs"></div>
                <div id="master-tasks" class="space-y-2 overflow-y-auto flex-1"></div>
            </div>

            <div class="lg:col-span-2 bg-white p-4 rounded-xl shadow-sm border h-[calc(100vh-230px)] flex flex-col">
                <div id="assignment-board" class="space-y-4 overflow-y-auto flex-1 pr-2"></div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // 店舗連動設定
        const currentStoreId = localStorage.getItem('ws_current_store_id') || "store_1";
        const storesMaster = JSON.parse(localStorage.getItem('ws_stores_master')) || [{ id: "store_1", name: "1号店 (本店)" }];
        const currentStore = storesMaster.find(s => s.id === currentStoreId) || storesMaster[0];
        document.getElementById('current-store-display').innerText = currentStore.name;

        // 店舗ごとにシフトデータを管理するキー
        const storageKey = `ws_shifts_data_${currentStoreId}`;
        
        let shiftsData = JSON.parse(localStorage.getItem(storageKey)) || {
            "s1": { name: "朝シフト (8:00〜12:00)", start: 8, end: 12, tasks: { 8: [], 9: [], 10: [], 11: [] } }
        };
        let currentShiftKey = Object.keys(shiftsData)[0];

        // --- 以下ロジック (保存時に storageKey を使用するように調整) ---
        function saveShifts() {
            localStorage.setItem(storageKey, JSON.stringify(shiftsData));
        }

        // ... (renderMaster, renderBoard, handleDrop などの関数は前回のものと同じ)
        // ※ただし saveShifts() が上記の storageKey を参照していることを確認してください。

        // 動作確認：店舗を切り替えてからシフト画面を開くと、空のシフトが表示されるはずです（店舗ごとのデータになるため）
        renderMaster();
        renderShiftSelect();
        renderBoard();
    </script>
</body>
</html>
