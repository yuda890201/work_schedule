<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>店舗管理ダッシュボード</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-6">
        <div class="bg-white p-4 rounded-xl shadow-sm border flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <span class="font-bold text-slate-700 text-sm">対象店舗:</span>
                <select id="store-select" onchange="changeStore(this.value)" class="p-2 border rounded-lg font-bold bg-slate-50 text-slate-800">
                </select>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openStoreModal()" class="px-4 py-2 bg-blue-600 text-white font-bold rounded-lg text-sm hover:bg-blue-700 flex items-center gap-1">
                    <i data-lucide="plus" class="w-4 h-4"></i> 新規店舗追加
                </button>
                <button onclick="openEditStoreModal()" class="px-3 py-2 bg-slate-200 text-slate-700 font-bold rounded-lg text-sm hover:bg-slate-300 flex items-center gap-1">
                    <i data-lucide="edit-3" class="w-4 h-4"></i> 店舗編集
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- カード類は省略（前回と同じです） -->
            <div onclick="window.location.href='index.html'" class="bg-white p-6 rounded-2xl shadow-sm border hover:border-blue-400 cursor-pointer flex items-center gap-4">
                <div class="p-4 bg-blue-50 text-blue-600 rounded-xl"><i data-lucide="pen-tool"></i></div>
                <div><h3 class="font-bold text-slate-800">作業入力ポータル</h3></div>
            </div>
            <div onclick="window.location.href='shift_assignment_v4.html'" class="bg-white p-6 rounded-2xl shadow-sm border hover:border-blue-400 cursor-pointer flex items-center gap-4">
                <div class="p-4 bg-emerald-50 text-emerald-600 rounded-xl"><i data-lucide="calendar"></i></div>
                <div><h3 class="font-bold text-slate-800">シフト割当管理</h3></div>
            </div>
            <div onclick="window.location.href='task_management.html'" class="bg-white p-6 rounded-2xl shadow-sm border hover:border-blue-400 cursor-pointer flex items-center gap-4">
                <div class="p-4 bg-amber-50 text-amber-600 rounded-xl"><i data-lucide="check-square"></i></div>
                <div><h3 class="font-bold text-slate-800">タスク管理マスター</h3></div>
            </div>
            <div onclick="window.location.href='staff_management.html'" class="bg-white p-6 rounded-2xl shadow-sm border hover:border-blue-400 cursor-pointer flex items-center gap-4">
                <div class="p-4 bg-purple-50 text-purple-600 rounded-xl"><i data-lucide="users"></i></div>
                <div><h3 class="font-bold text-slate-800">スタッフ管理</h3></div>
            </div>
        </div>
    </div>

    <!-- モーダル（省略：前回と同じです） -->
    <script>
        lucide.createIcons();

        // 店舗マスターの初期化（1号店・2号店をデフォルトに）
        let storesMaster = JSON.parse(localStorage.getItem('ws_stores_master'));
        if (!storesMaster || storesMaster.length === 0) {
            storesMaster = [{ id: "store_1", name: "1号店" }, { id: "store_2", name: "2号店" }];
            localStorage.setItem('ws_stores_master', JSON.stringify(storesMaster));
        }

        let currentStoreId = localStorage.getItem('ws_current_store_id');
        if (!currentStoreId || !storesMaster.find(s => s.id === currentStoreId)) {
            currentStoreId = storesMaster[0].id;
            localStorage.setItem('ws_current_store_id', currentStoreId);
        }

        // --- 以下ロジック（saveStoreなどの関数は前回と同じです） ---
        function renderStoreSelect() {
            const select = document.getElementById('store-select');
            select.innerHTML = storesMaster.map(s => `
                <option value="${s.id}" ${s.id === currentStoreId ? 'selected' : ''}>${s.name}</option>
            `).join('');
        }
        // ... (renderStoreSelect / saveStore 等の関数)
        renderStoreSelect();
    </script>
</body>
</html>
