<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>店舗管理ダッシュボード</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- ファビコン (ブラウザータブ用) -->
    <link rel="icon" type="image/png" href="icon-192.png">

    <!-- iOS (iPhone/iPad) ホーム画面用アイコン -->
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Android / PWA用マニフェストファイル参照 -->
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-6">
        <!-- ローディング表示 -->
        <div id="loading" class="bg-white p-6 rounded-xl shadow-sm border text-center font-bold text-slate-500">
            クラウドから店舗データを読み込み中...
        </div>

        <!-- 店舗切替・編集バー（データ読込後に表示） -->
        <div id="dashboard-content" class="space-y-6 hidden">
            <div class="bg-white p-4 rounded-xl shadow-sm border flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <span class="font-bold text-slate-700 text-sm">対象店舗:</span>
                    <select id="store-select" onchange="changeStore(this.value)" class="p-2 border rounded-lg font-bold bg-slate-50 text-slate-800">
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="openStoreModal()" class="px-4 py-2 bg-blue-600 text-white font-bold rounded-lg text-sm hover:bg-blue-700 flex items-center gap-1">
                        <i data-lucide="plus" class="w-4 h-4"></i> 新規店舗追加
                    </button>
                    <button onclick="openEditStoreModal()" class="px-3 py-2 bg-slate-200 text-slate-700 font-bold rounded-lg text-sm hover:bg-slate-300 flex items-center gap-1">
                        <i data-lucide="edit-3" class="w-4 h-4"></i> 店舗編集
                    </button>
                </div>
            </div>

            <!-- 各画面へのリンクカード -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div onclick="window.location.href='index.html'" class="bg-white p-6 rounded-2xl shadow-sm border hover:border-blue-400 hover:shadow-md transition cursor-pointer flex items-center gap-4">
                    <div class="p-4 bg-blue-50 text-blue-600 rounded-xl">
                        <i data-lucide="pen-tool" class="w-8 h-8"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-lg text-slate-800">WS作業入力ポータル</h3>
                        <p class="text-xs text-slate-500">現在の店舗のシフト作業・進捗を入力します</p>
                    </div>
                </div>

                <div onclick="window.location.href='shift_assignment_v4.html'" class="bg-white p-6 rounded-2xl shadow-sm border hover:border-blue-400 hover:shadow-md transition cursor-pointer flex items-center gap-4">
                    <div class="p-4 bg-emerald-50 text-emerald-600 rounded-xl">
                        <i data-lucide="calendar" class="w-8 h-8"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-lg text-slate-800">シフト割当管理</h3>
                        <p class="text-xs text-slate-500">店舗ごとの時間帯別タスク配置を作成します</p>
                    </div>
                </div>

                <div onclick="window.location.href='task_management.html'" class="bg-white p-6 rounded-2xl shadow-sm border hover:border-blue-400 hover:shadow-md transition cursor-pointer flex items-center gap-4">
                    <div class="p-4 bg-amber-50 text-amber-600 rounded-xl">
                        <i data-lucide="check-square" class="w-8 h-8"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-lg text-slate-800">タスク管理マスター</h3>
                        <p class="text-xs text-slate-500">店舗共通の作業マスターやサブタスクを編集します</p>
                    </div>
                </div>

                <div onclick="window.location.href='staff_management.html'" class="bg-white p-6 rounded-2xl shadow-sm border hover:border-blue-400 hover:shadow-md transition cursor-pointer flex items-center gap-4">
                    <div class="p-4 bg-purple-50 text-purple-600 rounded-xl">
                        <i data-lucide="users" class="w-8 h-8"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-lg text-slate-800">スタッフ管理</h3>
                        <p class="text-xs text-slate-500">スタッフ名簿や権限を管理します</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 店舗追加・編集モーダル -->
    <div id="store-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 space-y-4 shadow-xl">
            <h3 id="store-modal-title" class="font-bold text-lg text-slate-800">新規店舗の追加</h3>
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">店舗名（例: 3号店）</label>
                <input type="text" id="store-name-input" class="w-full p-2 border rounded-lg font-bold" placeholder="例: 3号店">
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeStoreModal()" class="px-4 py-2 bg-slate-200 text-slate-700 font-bold rounded-lg text-sm">キャンセル</button>
                <button onclick="saveStore()" class="px-4 py-2 bg-blue-600 text-white font-bold rounded-lg text-sm hover:bg-blue-700">保存する</button>
            </div>
        </div>
    </div>
<div onclick="window.location.href='analytics.html'" class="bg-white p-6 rounded-2xl shadow-sm border hover:border-blue-400 hover:shadow-md transition cursor-pointer flex items-center gap-4">
    <div class="p-4 bg-indigo-50 text-indigo-600 rounded-xl">
        <i data-lucide="bar-chart-2" class="w-8 h-8"></i>
    </div>
    <div>
        <h3 class="font-bold text-lg text-slate-800">作業分析・集計</h3>
        <p class="text-xs text-slate-500">スタッフごとの完了数や所要時間を分析します</p>
    </div>
</div>
    <script>
        lucide.createIcons();

        // ★ここにGASのウェブアプリURLを設定してください
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyaJTbew77-WVvluXD7OnQPa2TVhoFRPLzv3Bq3uopQUPTjhqTtdUIV4du5pmSzyUkFaA/exec";

        let storesMaster = [];
        let currentStoreId = localStorage.getItem('ws_current_store_id');
        let isStoreEditing = false;

        // クラウドから店舗データを取得
        async function fetchStoresData() {
            try {
                const response = await fetch(`${GAS_API_URL}?sheet=stores`);
                const data = await response.json();
                
                if (Array.isArray(data) && data.length > 0) {
                    storesMaster = data;
                } else {
                    // 初期データ（1号店・2号店）
                    storesMaster = [
                        { id: "store_1", name: "1号店" },
                        { id: "store_2", name: "2号店" }
                    ];
                    await saveStoresDataToCloud();
                }
            } catch (error) {
                console.error("店舗データ取得エラー:", error);
                storesMaster = JSON.parse(localStorage.getItem('ws_stores_master')) || [
                    { id: "store_1", name: "1号店" },
                    { id: "store_2", name: "2号店" }
                ];
            }

            // 選択中店舗の整合性チェック
            if (!currentStoreId || !storesMaster.find(s => s.id === currentStoreId)) {
                currentStoreId = storesMaster[0].id;
                localStorage.setItem('ws_current_store_id', currentStoreId);
            }

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('dashboard-content').classList.remove('hidden');
            renderStoreSelect();
        }

        // クラウドへ店舗データを保存
        async function saveStoresDataToCloud() {
            try {
                await fetch(GAS_API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ sheet: "stores", action: "save", rows: storesMaster })
                });
            } catch (error) {
                console.error("店舗データ保存エラー:", error);
                alert("クラウドへの保存に失敗しました。");
            }
        }

        function renderStoreSelect() {
            const select = document.getElementById('store-select');
            select.innerHTML = storesMaster.map(s => `
                <option value="${s.id}" ${s.id === currentStoreId ? 'selected' : ''}>${s.name}</option>
            `).join('');
            // ローカルストレージにもバックアップとして保存
            localStorage.setItem('ws_stores_master', JSON.stringify(storesMaster));
        }

        function changeStore(storeId) {
            currentStoreId = storeId;
            localStorage.setItem('ws_current_store_id', storeId);
        }

        function openStoreModal() {
            isStoreEditing = false;
            document.getElementById('store-modal-title').innerText = "新規店舗の追加";
            document.getElementById('store-name-input').value = "";
            document.getElementById('store-modal').classList.remove('hidden');
        }

        function openEditStoreModal() {
            const currentStore = storesMaster.find(s => s.id === currentStoreId);
            if (!currentStore) return;
            isStoreEditing = true;
            document.getElementById('store-modal-title').innerText = "店舗名の編集";
            document.getElementById('store-name-input').value = currentStore.name;
            document.getElementById('store-modal').classList.remove('hidden');
        }

        function closeStoreModal() {
            document.getElementById('store-modal').classList.add('hidden');
        }

        async function saveStore() {
            const name = document.getElementById('store-name-input').value.trim();
            if (!name) {
                alert("店舗名を入力してください");
                return;
            }

            if (isStoreEditing) {
                const currentStore = storesMaster.find(s => s.id === currentStoreId);
                if (currentStore) {
                    currentStore.name = name;
                }
            } else {
                const newId = 'store_' + Date.now();
                storesMaster.push({ id: newId, name: name });
                currentStoreId = newId;
                localStorage.setItem('ws_current_store_id', newId);
            }

            closeStoreModal();
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('dashboard-content').classList.add('hidden');

            await saveStoresDataToCloud();
            await fetchStoresData();
        }

        // 初期化実行
        fetchStoresData();
    </script>
</body>
</html>
