<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>スタッフ管理（スプレッドシート連携）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- ファビコン (ブラウザータブ用) -->
    <link rel="icon" type="image/png" href="icon-192.png">

    <!-- iOS (iPhone/iPad) ホーム画面用アイコン -->
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Android / PWA用マニフェストファイル参照 -->
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-6">
        <div class="flex justify-between items-center">
            <h2 class="text-2xl font-bold text-slate-800">スタッフ管理（クラウド同期）</h2>
            <button onclick="window.location.href='dashboard.html'" class="text-slate-500 hover:text-slate-900 font-bold">ダッシュボードへ戻る</button>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-slate-400">現在表示中:</span>
                <span id="current-store-display" class="font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full text-sm"></span>
            </div>
            <button onclick="openAddModal()" class="px-4 py-2 bg-blue-600 text-white font-bold rounded-lg text-sm hover:bg-blue-700 flex items-center gap-1">
                <i data-lucide="plus" class="w-4 h-4"></i> 新規スタッフ追加
            </button>
        </div>

        <!-- ローディング表示 -->
        <div id="loading" class="text-center py-8 text-slate-500 font-bold">データをクラウドから読み込み中...</div>

        <div class="bg-white rounded-xl shadow-sm border overflow-hidden hidden" id="table-container">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50 border-b text-slate-500 text-xs font-bold">
                        <th class="p-4">従業員番号</th>
                        <th class="p-4">名前</th>
                        <th class="p-4">所属店舗名</th>
                        <th class="p-4">備考</th>
                        <th class="p-4 text-right">操作</th>
                    </tr>
                </thead>
                <tbody id="staff-table-body" class="divide-y text-sm text-slate-700"></tbody>
            </table>
        </div>
    </div>

    <!-- モーダル -->
    <div id="staff-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 space-y-4 shadow-xl">
            <h3 id="modal-title" class="font-bold text-lg text-slate-800">スタッフ情報</h3>
            <div class="space-y-3">
                <input type="text" id="staff-id-input" class="w-full p-2 border rounded-lg font-bold" placeholder="従業員番号">
                <input type="text" id="staff-name-input" class="w-full p-2 border rounded-lg font-bold" placeholder="名前">
                <select id="staff-store-input" class="w-full p-2 border rounded-lg font-bold bg-slate-50"></select>
                <input type="text" id="staff-note-input" class="w-full p-2 border rounded-lg font-bold" placeholder="備考">
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-200 text-slate-700 font-bold rounded-lg text-sm">キャンセル</button>
                <button onclick="saveStaff()" class="px-4 py-2 bg-blue-600 text-white font-bold rounded-lg text-sm hover:bg-blue-700">保存する</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // ★ここにデプロイしたGoogle Apps ScriptのウェブアプリURLを入力してください
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyaJTbew77-WVvluXD7OnQPa2TVhoFRPLzv3Bq3uopQUPTjhqTtdUIV4du5pmSzyUkFaA/exec"; 

        const storesMaster = JSON.parse(localStorage.getItem('ws_stores_master')) || [{ id: "store_1", name: "1号店" }, { id: "store_2", name: "2号店" }];
        const currentStoreId = localStorage.getItem('ws_current_store_id') || storesMaster[0].id;
        const currentStore = storesMaster.find(s => s.id === currentStoreId) || storesMaster[0];
        document.getElementById('current-store-display').innerText = currentStore.name;

        let staffList = [];
        let editingUniqueId = null;

        // スプレッドシートからデータを取得
        async function fetchStaffData() {
            try {
                const response = await fetch(`${GAS_API_URL}?sheet=staff`);
                const data = await response.json();
                
                if (Array.isArray(data) && data.length > 0) {
                    staffList = data;
                } else {
                    // データが空の場合はデフォルトデータを生成してクラウドに保存
                    staffList = [
                        { uniqueId: 1, empId: "MGR001", name: "オーナー", store: storesMaster[0].name, note: "オーナー" },
                        { uniqueId: 2, empId: "STF001", name: "スタッフ1", store: storesMaster[0].name, note: "スタッフ" }
                    ];
                    await saveStaffDataToCloud();
                }
            } catch (error) {
                console.error("データ取得エラー:", error);
                alert("クラウドからのデータ取得に失敗しました。ローカルデータを使用します。");
                staffList = JSON.parse(localStorage.getItem('ws_staff_list')) || [];
            }

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('table-container').classList.remove('hidden');
            renderStoreOptions();
            renderTable();
        }

        // スプレッドシートへデータを保存
        async function saveStaffDataToCloud() {
            try {
                await fetch(GAS_API_URL, {
                    method: "POST",
                    mode: "no-cors", // GASのCORS制限回避用
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ sheet: "staff", action: "save", rows: staffList })
                });
            } catch (error) {
                console.error("データ保存エラー:", error);
                alert("クラウドへの保存に失敗しました。");
            }
        }

        function renderStoreOptions() {
            const select = document.getElementById('staff-store-input');
            select.innerHTML = storesMaster.map(s => `<option value="${s.name}">${s.name}</option>`).join('');
        }

        function renderTable() {
            const tbody = document.getElementById('staff-table-body');
            const sortedList = [...staffList].sort((a, b) => (b.store === currentStore.name) - (a.store === currentStore.name));

            tbody.innerHTML = sortedList.map(s => `
                <tr class="${s.store === currentStore.name ? 'bg-blue-50/30' : ''} hover:bg-slate-50">
                    <td class="p-4 font-mono font-bold">${s.empId}</td>
                    <td class="p-4 font-bold">${s.name}</td>
                    <td class="p-4"><span class="px-2 py-1 text-xs font-bold ${s.store === currentStore.name ? 'bg-blue-100 text-blue-700' : 'bg-slate-100 text-slate-600'} rounded">${s.store}</span></td>
                    <td class="p-4 text-slate-500">${s.note}</td>
                    <td class="p-4 text-right">
                        <button onclick="openEditModal(${s.uniqueId})" class="text-blue-600 font-bold text-xs bg-blue-50 px-2.5 py-1.5 rounded hover:bg-blue-100">編集</button>
                    </td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        function openAddModal() {
            editingUniqueId = null;
            document.getElementById('modal-title').innerText = "新規スタッフ追加";
            document.getElementById('staff-id-input').value = "EMP" + Math.floor(Math.random() * 900 + 100);
            document.getElementById('staff-name-input').value = "";
            document.getElementById('staff-note-input').value = "";
            renderStoreOptions();
            document.getElementById('staff-modal').classList.remove('hidden');
        }

        function openEditModal(id) {
            const s = staffList.find(x => Number(x.uniqueId) === Number(id));
            if (!s) return;
            editingUniqueId = id;
            document.getElementById('modal-title').innerText = "スタッフ編集";
            document.getElementById('staff-id-input').value = s.empId;
            document.getElementById('staff-name-input').value = s.name;
            renderStoreOptions();
            document.getElementById('staff-store-input').value = s.store;
            document.getElementById('staff-note-input').value = s.note;
            document.getElementById('staff-modal').classList.remove('hidden');
        }

        function closeModal() { 
            document.getElementById('staff-modal').classList.add('hidden'); 
        }

        async function saveStaff() {
            const data = {
                uniqueId: editingUniqueId ? editingUniqueId : Date.now(),
                empId: document.getElementById('staff-id-input').value.trim(),
                name: document.getElementById('staff-name-input').value.trim(),
                store: document.getElementById('staff-store-input').value,
                note: document.getElementById('staff-note-input').value.trim()
            };

            if (!data.name) {
                alert("スタッフ名を入力してください。");
                return;
            }

            if (editingUniqueId) {
                const index = staffList.findIndex(x => Number(x.uniqueId) === Number(editingUniqueId));
                if (index !== -1) staffList[index] = data;
            } else {
                staffList.push(data);
            }
            
            closeModal();
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('table-container').classList.add('hidden');
            
            await saveStaffDataToCloud();
            await fetchStaffData(); // 再読み込み
        }

        // 初期化実行
        fetchStaffData();
    </script>
</body>
</html>
