<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WS作業入力ポータル</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 min-h-screen">

    <header class="bg-slate-900 text-white p-4 sticky top-0 z-10 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='dashboard.html'" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 font-bold transition">← 戻る</button>
                <h1 class="font-bold flex items-center gap-2"><i data-lucide="pen-tool"></i> WS作業入力</h1>
            </div>
            <div id="store-name-display" class="font-bold text-blue-400"></div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 space-y-6">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <label class="block text-xs font-bold text-slate-500 mb-2">対象シフト</label>
            <select id="shift-select" onchange="loadShiftData()" class="w-full p-4 bg-slate-50 border border-slate-300 rounded-lg font-bold text-lg"></select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="main-area">
            <div id="r1-area" class="flex gap-4 min-h-[400px]"></div>
            <div id="r2-area" class="flex gap-4 min-h-[400px]"></div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        // 1. 店舗・シフト情報の読み込み
        const currentStoreId = localStorage.getItem('ws_current_store_id') || "store_1";
        const storesMaster = JSON.parse(localStorage.getItem('ws_stores_master')) || [{ id: "store_1", name: "本店" }];
        const currentStore = storesMaster.find(s => s.id === currentStoreId) || storesMaster[0];
        document.getElementById('store-name-display').innerText = currentStore.name;

        const shiftsData = JSON.parse(localStorage.getItem(`ws_shifts_data_${currentStoreId}`)) || {};
        
        // シフト選択肢の生成
        const select = document.getElementById('shift-select');
        Object.keys(shiftsData).forEach(key => {
            select.innerHTML += `<option value="${key}">${shiftsData[key].name}</option>`;
        });

        let state = { r1: [], r2: [], currentHour: 8 };

        function loadShiftData() {
            // ここに選択したシフトデータを読み込むロジックを配置
            // ※入力ポータル用のデータ構造に合わせて表示を更新
            renderApp();
        }

        function renderApp() {
            // ... (前回の描画ロジックをここに適用)
            console.log("店舗モード:", currentStore.name, "で表示中");
        }

        loadShiftData();
    </script>
</body>
</html>
