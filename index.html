<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WS入力ポータル - 完全統合版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen">

    <header class="bg-slate-900 text-white p-4 sticky top-0 z-10 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='dashboard.html'" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 font-bold transition">
                    ← ダッシュボードへ
                </button>
                <h1 class="font-bold flex items-center gap-2"><i data-lucide="pen-tool"></i> WS作業入力</h1>
            </div>
            <div id="global-timer" class="font-mono text-emerald-400 font-bold text-xl">00:00:00</div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 space-y-6">
        
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <label class="block text-xs font-bold text-slate-500 mb-2">現在のシフト</label>
            <select id="shift-select" onchange="resetShift()" class="w-full p-4 bg-slate-50 border border-slate-300 rounded-lg font-bold text-lg">
                <option value="s1">朝シフト (8:00〜12:00)</option>
            </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="main-area">
            <div id="r1-area" class="flex gap-4 min-h-[400px]"></div>
            <div id="r2-area" class="flex gap-4 min-h-[400px]"></div>
        </div>
    </main>

    <!-- サブタスク用モーダル -->
    <div id="task-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 space-y-4">
            <h3 id="modal-title" class="font-bold text-lg">タスク名</h3>
            <div id="subtask-list" class="space-y-2"></div>
            <button id="complete-btn" onclick="confirmTask()" disabled class="w-full p-4 rounded-xl bg-slate-200 text-slate-500 font-bold cursor-not-allowed">すべて完了して保存</button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        
        const TASKS = {
            s1: {
                r1: {
                    8: [{ name: "ポットお湯補充", subs: ["お湯確認", "空焚き防止確認"] }, { name: "FF袋補充", subs: ["中補充", "大補充"] }],
                    9: [{ name: "山崎パン2便", subs: ["棚並べ", "期限チェック"] }, { name: "レジ点検", subs: ["過不足確認", "POP確認"] }]
                },
                r2: {
                    8: [{ name: "温度チェック", subs: ["検温", "記録記入"] }, { name: "売場写真", subs: ["全景撮影", "報告送信"] }],
                    9: [{ name: "値引きシール貼り", subs: ["値引品確認", "シール貼り"] }, { name: "日付管理商品", subs: ["期限チェック", "陳列"] }]
                }
            }
        };

        let state = { r1: [], r2: [], currentHour: 8, activeTask: null, activeReg: null }; 
        let phaseStartTime = Date.now();

        setInterval(() => {
            const elapsed = Math.floor((Date.now() - phaseStartTime) / 1000);
            document.getElementById('global-timer').innerText = new Date(elapsed * 1000).toISOString().substr(11, 8);
        }, 1000);

        function resetShift() {
            state = { r1: [], r2: [], currentHour: 8, activeTask: null, activeReg: null };
            phaseStartTime = Date.now();
            renderApp();
        }

        function renderApp() {
            renderSection('r1', '1レジ');
            renderSection('r2', '2レジ');
        }

        function renderSection(regKey, title) {
            const container = document.getElementById(`${regKey}-area`);
            const shiftData = TASKS['s1'][regKey];
            const allTasks = Object.values(shiftData).flat();
            const currentTasks = shiftData[state.currentHour] || [];

            container.innerHTML = `
                <div class="flex flex-col gap-2 shrink-0">
                    ${allTasks.map(t => `
                        <div class="flex items-center gap-2">
                            <div class="w-4 h-12 rounded-full ${state[regKey].includes(t.name) ? 'bg-emerald-500' : 'bg-slate-300'}"></div>
                            <span class="text-[10px] font-bold text-slate-500 w-24 truncate">${t.name}</span>
                        </div>
                    `).join('')}
                </div>
                
                <div class="flex-1 space-y-4">
                    <h3 class="font-bold text-slate-700 text-xl">${title}</h3>
                    <div class="p-4 bg-slate-900 rounded-xl text-white">
                        <p class="text-xs text-slate-400">現在のフェーズ</p>
                        <p class="text-2xl font-bold font-mono">${state.currentHour}:00〜</p>
                    </div>

                    ${currentTasks.map(t => `
                        <button onclick="openModal('${regKey}', '${t.name}')" 
                            class="w-full p-5 rounded-xl border-2 font-bold transition flex items-center justify-between ${state[regKey].includes(t.name) ? 'bg-emerald-50 border-emerald-500 text-emerald-800' : 'bg-white border-slate-200 text-slate-800 hover:border-blue-400'}">
                            ${t.name}
                            ${state[regKey].includes(t.name) ? '<i data-lucide="check-circle" class="text-emerald-600"></i>' : ''}
                        </button>
                    `).join('')}

                    ${currentTasks.length > 0 && currentTasks.every(t => state[regKey].includes(t.name)) ? 
                        `<button onclick="nextHour('${regKey}')" class="w-full p-4 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:bg-blue-700 animate-bounce">次の時間へ進む →</button>` 
                        : ''}
                </div>
            `;
            lucide.createIcons();
        }

        function openModal(regKey, taskName) {
            state.activeTask = taskName;
            state.activeReg = regKey;
            const task = TASKS['s1'][regKey][state.currentHour].find(t => t.name === taskName);
            const list = document.getElementById('subtask-list');
            const btn = document.getElementById('complete-btn');
            
            document.getElementById('modal-title').innerText = taskName;
            list.innerHTML = task.subs.map(s => `
                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg cursor-pointer">
                    <input type="checkbox" onchange="checkSubtasks()" class="sub-checkbox w-5 h-5">
                    <span>${s}</span>
                </label>
            `).join('');
            
            btn.disabled = true;
            btn.className = "w-full p-4 rounded-xl bg-slate-200 text-slate-500 font-bold cursor-not-allowed";
            document.getElementById('task-modal').classList.remove('hidden');
        }

        function checkSubtasks() {
            const boxes = document.querySelectorAll('.sub-checkbox');
            const allChecked = Array.from(boxes).every(b => b.checked);
            const btn = document.getElementById('complete-btn');
            if (allChecked) {
                btn.disabled = false;
                btn.className = "w-full p-4 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700";
            }
        }

        function confirmTask() {
            state[state.activeReg].push(state.activeTask);
            document.getElementById('task-modal').classList.add('hidden');
            renderApp();
        }

        function nextHour(regKey) {
            if (state.currentHour < 11) {
                state.currentHour += 1;
                phaseStartTime = Date.now();
                renderApp();
            }
        }

        renderApp();
    </script>
</body>
</html>
