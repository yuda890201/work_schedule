<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WS作業入力ポータル - ログ蓄積版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen">

    <header class="bg-slate-900 text-white p-4 sticky top-0 z-10 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='dashboard.html'" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 font-bold transition">← ダッシュボードへ</button>
                <h1 class="font-bold flex items-center gap-2"><i data-lucide="pen-tool"></i> WS作業入力</h1>
            </div>
            <div class="flex items-center gap-4">
                <span id="store-name-display" class="text-xs bg-blue-600 px-2.5 py-1 rounded-full font-bold"></span>
                <div id="realtime-clock" class="font-mono text-emerald-400 font-bold text-xl">00:00:00</div>
            </div>
        </div>
    </header>

    <!-- ローディング表示 -->
    <div id="loading" class="max-w-6xl mx-auto p-12 text-center font-bold text-slate-500">
        クラウドから作業ポータルデータを読み込み中...
    </div>

    <main class="max-w-6xl mx-auto p-4 space-y-6 hidden" id="main-content">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <label class="block text-xs font-bold text-slate-500 mb-2">現在のシフト</label>
            <select id="shift-select" onchange="resetShift()" class="w-full p-4 bg-slate-50 border border-slate-300 rounded-lg font-bold text-lg">
                <!-- 動的に生成されます -->
            </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="main-area">
            <div id="r1-area" class="flex gap-4 min-h-[400px]"></div>
            <div id="r2-area" class="flex gap-4 min-h-[400px]"></div>
        </div>
    </main>

    <!-- サブタスク用モーダル -->
    <div id="task-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 space-y-4 shadow-xl">
            <h3 id="modal-title" class="font-bold text-lg">タスク名</h3>
            <div id="subtask-list" class="space-y-2"></div>
            <button id="complete-btn" onclick="confirmTask()" disabled class="w-full p-4 rounded-xl bg-slate-200 text-slate-500 font-bold cursor-not-allowed">すべて完了して保存</button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        
        // ★ここにGASのウェブアプリURLを設定してください
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyaJTbew77-WVvluXD7OnQPa2TVhoFRPLzv3Bq3uopQUPTjhqTtdUIV4du5pmSzyUkFaA/exec";

        const currentStoreId = localStorage.getItem('ws_current_store_id') || "store_1";
        const storesMaster = JSON.parse(localStorage.getItem('ws_stores_master')) || [{ id: "store_1", name: "1号店" }, { id: "store_2", name: "2号店" }];
        const currentStore = storesMaster.find(s => s.id === currentStoreId) || storesMaster[0];
        document.getElementById('store-name-display').innerText = currentStore.name;

        let staffList = [];
        let taskMasterMap = {};
        let SHIFT_DATA = {};
        let currentShiftKey = "";
        let currentShift = null;

        let state = { 
            r1: [], r2: [], 
            r1Times: {}, r2Times: {}, 
            r1LastCompleteTime: Date.now(), 
            r2LastCompleteTime: Date.now(),
            r1StartTime: Date.now(), 
            r2StartTime: Date.now(),
            r1Staff: "未選択",
            r2Staff: "未選択",
            currentHour: 8 
        }; 

        // クラウドから全データを一括非同期取得
        async function initPortal() {
            try {
                const staffRes = await fetch(`${GAS_API_URL}?sheet=staff`);
                const staffData = await staffRes.json();
                staffList = Array.isArray(staffData) ? staffData : [];

                const taskRes = await fetch(`${GAS_API_URL}?sheet=tasks`);
                const taskData = await taskRes.json();
                if (Array.isArray(taskData)) {
                    taskData.forEach(t => { 
                        if (t && t.name) {
                            taskMasterMap[t.name.trim()] = typeof t.subs === 'string' ? t.subs.split(',').filter(Boolean) : (t.subs || []); 
                        }
                    });
                }

                const sheetName = `shifts_${currentStoreId}`;
                const shiftRes = await fetch(`${GAS_API_URL}?sheet=${sheetName}`);
                const shiftDataJson = await shiftRes.json();

                if (Array.isArray(shiftDataJson) && shiftDataJson.length > 0) {
                    SHIFT_DATA = JSON.parse(shiftDataJson[0].data || "{}");
                }

                if (!SHIFT_DATA || Object.keys(SHIFT_DATA).length === 0) {
                    SHIFT_DATA = {
                        "s_morning": { 
                            name: "朝シフト (8:00〜12:00)", 
                            start: 8, 
                            end: 12, 
                            tasks: { 
                                r1: { 8: ["ポットのお湯確認補充"], 9: ["値引きシール貼り( )14"] }, 
                                r2: { 8: ["温度チェック★"], 10: ["チルド飲料品出し"] } 
                            } 
                        }
                    };
                }

                currentShiftKey = Object.keys(SHIFT_DATA)[0];
                currentShift = SHIFT_DATA[currentShiftKey];
                state.currentHour = currentShift.start;
                
                if (staffList.length > 0) {
                    state.r1Staff = staffList[0].name;
                    if (staffList.length > 1) state.r2Staff = staffList[1].name;
                }

            } catch (error) {
                console.error("ポータル初期化エラー:", error);
                SHIFT_DATA = {
                    "s1": { name: "朝シフト (8:00〜12:00)", start: 8, end: 12, tasks: { r1: { 8: ["ポットのお湯確認補充"] }, r2: { 8: ["温度チェック★"] } } }
                };
                currentShiftKey = Object.keys(SHIFT_DATA)[0];
                currentShift = SHIFT_DATA[currentShiftKey];
            }

            const shiftSelect = document.getElementById('shift-select');
            shiftSelect.innerHTML = Object.keys(SHIFT_DATA).map(k => `
                <option value="${k}">${SHIFT_DATA[k].name}</option>
            `).join('');

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            renderApp();
        }

        setInterval(() => {
            const now = new Date();
            document.getElementById('realtime-clock').innerText = now.toTimeString().split(' ')[0];

            updateRegTimer('r1', state.r1StartTime);
            updateRegTimer('r2', state.r2StartTime);
        }, 1000);

        function updateRegTimer(regKey, startTime) {
            const timerEl = document.getElementById(`${regKey}-timer`);
            if (timerEl) {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                timerEl.innerText = new Date(elapsed * 1000).toISOString().substr(11, 8);
            }
        }

        function resetShift() {
            currentShiftKey = document.getElementById('shift-select').value;
            currentShift = SHIFT_DATA[currentShiftKey];
            state.currentHour = currentShift.start;
            state.r1 = [];
            state.r2 = [];
            state.r1Times = {};
            state.r2Times = {};
            state.r1StartTime = Date.now();
            state.r2StartTime = Date.now();
            state.r1LastCompleteTime = Date.now();
            state.r2LastCompleteTime = Date.now();
            renderApp();
        }

        function updateStaff(regKey, staffName) {
            if (regKey === 'r1') state.r1Staff = staffName;
            if (regKey === 'r2') state.r2Staff = staffName;
        }

        function renderApp() {
            renderSection('r1', '1レジ担当者', state.r1Staff);
            renderSection('r2', '2レジ担当者', state.r2Staff);
        }

        function renderSection(regKey, title, currentStaff) {
            const container = document.getElementById(`${regKey}-area`);
            const regTasksByHour = currentShift.tasks[regKey] || {};
            
            const allTaskNames = [...new Set(Object.values(regTasksByHour).flat())];
            const currentTasks = regTasksByHour[state.currentHour] || [];
            const timesMap = regKey === 'r1' ? state.r1Times : state.r2Times;
            const startTime = regKey === 'r1' ? state.r1StartTime : state.r2StartTime;
            const initialElapsed = Math.floor((Date.now() - startTime) / 1000);
            const initialElapsedStr = new Date(initialElapsed * 1000).toISOString().substr(11, 8);

            const staffOptions = staffList.map(s => `
                <option value="${s.name}" ${s.name === currentStaff ? 'selected' : ''}>${s.name} / ${s.store || '店舗未設定'}</option>
            `).join('');

            container.innerHTML = `
                <div class="flex flex-col gap-2 shrink-0 w-28">
                    ${allTaskNames.map(name => `
                        <div class="flex items-center gap-2">
                            <div class="w-3 h-10 rounded-full ${state[regKey].includes(name) ? 'bg-emerald-500' : 'bg-slate-300'}"></div>
                            <span class="text-[10px] font-bold text-slate-500 truncate" title="${name}">${name}</span>
                        </div>
                    `).join('')}
                </div>
                
                <div class="flex-1 space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-slate-700 text-xl">${title}</h3>
                        <select onchange="updateStaff('${regKey}', this.value)" class="text-xs p-2 border rounded-lg font-bold bg-white text-slate-700 shadow-sm">
                            <option value="未選択">担当者を選択</option>
                            ${staffOptions}
                        </select>
                    </div>

                    <div class="p-4 bg-slate-900 rounded-xl text-white flex justify-between items-center">
                        <div>
                            <p class="text-xs text-slate-400">現在のフェーズ</p>
                            <p class="text-2xl font-bold font-mono">${state.currentHour}:00〜</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs text-slate-400">経過時間</p>
                            <p id="${regKey}-timer" class="text-xl font-bold font-mono text-emerald-400">${initialElapsedStr}</p>
                        </div>
                    </div>

                    ${currentTasks.length === 0 ? '<p class="text-xs text-slate-400 py-4">この時間の割当タスクはありません</p>' : ''}

                    ${currentTasks.map(name => {
                        const isCompleted = state[regKey].includes(name);
                        const durationSec = timesMap[name];
                        let timeDisplay = '';
                        if (isCompleted && durationSec !== undefined) {
                            const m = Math.floor(durationSec / 60);
                            const s = durationSec % 60;
                            timeDisplay = `<span class="text-xs font-mono bg-emerald-100 text-emerald-800 px-2 py-1 rounded">所要時間: ${m > 0 ? m + '分' : ''}${s}秒</span>`;
                        }

                        return `
                            <button onclick="handleTaskClick('${regKey}', '${name}')" 
                                class="w-full p-4 rounded-xl border-2 font-bold transition flex items-center justify-between ${isCompleted ? 'bg-emerald-50 border-emerald-500 text-emerald-800' : 'bg-white border-slate-200 text-slate-800 hover:border-blue-400'}">
                                <span>${name}</span>
                                <div class="flex items-center gap-2">
                                    ${timeDisplay}
                                    ${isCompleted ? '<i data-lucide="check-circle" class="text-emerald-600"></i>' : ''}
                                </div>
                            </button>
                        `;
                    }).join('')}

                    ${currentTasks.length > 0 && currentTasks.every(name => state[regKey].includes(name)) ? 
                        `<button onclick="nextHour('${regKey}')" class="w-full p-4 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:bg-blue-700 animate-bounce">次の時間へ進む →</button>` 
                        : ''}
                </div>
            `;
            lucide.createIcons();
        }

        let tempTaskClickInfo = null;

        function handleTaskClick(regKey, taskName) {
            if (state[regKey].includes(taskName)) return;

            const trimmedName = taskName.trim();
            let subs = taskMasterMap[trimmedName];
            
            if (!subs || !Array.isArray(subs) || subs.length === 0) {
                subs = ["実施確認", "完了確認"];
            }
            
            tempTaskClickInfo = { regKey, taskName, clickTime: Date.now() };
            openModal(regKey, taskName, subs);
        }

        function openModal(regKey, taskName, subs) {
            state.activeTask = taskName;
            state.activeReg = regKey;
            
            const list = document.getElementById('subtask-list');
            const btn = document.getElementById('complete-btn');
            
            document.getElementById('modal-title').innerText = taskName;
            list.innerHTML = subs.map(s => `
                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg cursor-pointer">
                    <input type="checkbox" onchange="checkSubtasks()" class="sub-checkbox w-5 h-5">
                    <span>${s}</span>
                </label>
            `).join('');
            
            btn.disabled = true;
            btn.className = "w-full p-4 rounded-xl bg-slate-200 text-slate-500 font-bold cursor-not-allowed";
            document.getElementById('task-modal').classList.remove('hidden');
        }

        function checkSubtasks() {
            const boxes = document.querySelectorAll('.sub-checkbox');
            const allChecked = boxes.length > 0 && Array.from(boxes).every(b => b.checked);
            const btn = document.getElementById('complete-btn');
            if (allChecked) {
                btn.disabled = false;
                btn.className = "w-full p-4 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700";
            } else {
                btn.disabled = true;
                btn.className = "w-full p-4 rounded-xl bg-slate-200 text-slate-500 font-bold cursor-not-allowed";
            }
        }

        // タスク完了時にスプレッドシートの logs シートへ自動記録
        async function confirmTask() {
            const regKey = state.activeReg;
            const taskName = state.activeTask;

            if (!state[regKey].includes(taskName)) {
                const nowTime = Date.now();
                const lastTime = regKey === 'r1' ? state.r1LastCompleteTime : state.r2LastCompleteTime;
                const durationSec = Math.floor((nowTime - lastTime) / 1000);

                if (regKey === 'r1') {
                    state.r1Times[taskName] = durationSec;
                    state.r1LastCompleteTime = nowTime;
                } else {
                    state.r2Times[taskName] = durationSec; // 修正点: duration から durationSec に統一
                    state.r2LastCompleteTime = nowTime;
                }

                state[regKey].push(taskName);

                const staffName = regKey === 'r1' ? state.r1Staff : state.r2Staff;
                const logData = {
                    sheet: "logs",
                    action: "append",
                    row: {
                        timestamp: new Date().toLocaleString(),
                        store: currentStore.name,
                        shift: currentShift.name,
                        reg: regKey === 'r1' ? '1レジ' : '2レジ',
                        staff: staffName,
                        task: taskName,
                        hour: state.currentHour + "時台",
                        duration_sec: durationSec
                    }
                };

                try {
                    fetch(GAS_API_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(logData)
                    });
                } catch (err) {
                    console.error("ログ送信エラー:", err);
                }
            }

            document.getElementById('task-modal').classList.add('hidden');
            renderApp();
        }

        function nextHour(regKey) {
            if (state.currentHour < currentShift.end - 1) {
                state.currentHour += 1;
                const nowTime = Date.now();
                if (regKey === 'r1') {
                    state.r1StartTime = nowTime;
                    state.r1LastCompleteTime = nowTime;
                }
                if (regKey === 'r2') {
                    state.r2StartTime = nowTime;
                    state.r2LastCompleteTime = nowTime;
                }
                renderApp();
            } else {
                alert("このシフトの最終時間です！お疲れ様でした。");
            }
        }

        // 初期化実行
        initPortal();
    </script>
</body>
</html>
