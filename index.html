<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワークスケジュール - 作業入力ポータル</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @media print {
            body * { visibility: hidden; }
            #print-report-area, #print-report-area * { visibility: visible; }
            #print-report-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 10mm;
                box-sizing: border-box;
                background: white !important;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <!-- 🌐 ローディングオーバーレイ -->
    <div id="loading-overlay" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center space-y-6 p-6 transition-opacity duration-300">
        <div class="relative flex items-center justify-center">
            <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
            <span class="absolute text-xl">🏪</span>
        </div>
        <div class="text-center space-y-2 max-w-md">
            <p class="text-white font-bold text-base tracking-wider">クラウドから店舗データを同期中...</p>
            <div id="loading-tip-box" class="bg-slate-800/90 border border-slate-700 p-4 rounded-xl shadow-lg text-emerald-300 text-xs font-bold leading-relaxed min-h-[60px] flex items-center justify-center">
            </div>
        </div>
    </div>

    <header class="bg-slate-900 text-white p-4 sticky top-0 z-10 shadow-md no-print">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <button onclick="safeNavigate('dashboard.html')" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 font-bold transition">← ダッシュボードへ</button>
                <h1 class="font-bold flex items-center gap-2"><i data-lucide="pen-tool"></i> ワークスケジュール作業入力</h1>
            </div>
            <div class="flex items-center gap-4">
                <span id="store-name-display" class="text-xs bg-blue-600 px-2.5 py-1 rounded-full font-bold"></span>
                <div id="realtime-clock" class="font-mono text-emerald-400 font-bold text-xl">00:00:00</div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 space-y-6 hidden" id="main-content">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-4 no-print">
            <div class="flex-1 min-w-[250px]">
                <label class="block text-xs font-bold text-slate-500 mb-1">現在のシフト (<span id="store-label" class="text-blue-600"></span>)</label>
                <select id="shift-select" onchange="resetShift()" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg font-bold text-base">
                </select>
            </div>
            <div>
                <button onclick="openPrintPreview()" class="px-5 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow flex items-center gap-2 transition">
                    <i data-lucide="printer" class="w-5 h-5"></i> シフト報告シートを印刷
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="main-area">
            <div id="r1-area" class="flex gap-4 min-h-[400px]"></div>
            <div id="r2-area" class="flex gap-4 min-h-[400px]"></div>
        </div>
    </main>

    <!-- サブタスク用モーダル（スキップ・キャンセルボタン付き） -->
    <div id="task-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50 no-print">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="modal-title" class="font-bold text-lg text-slate-800">タスク名</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="subtask-list" class="space-y-2"></div>
            <div class="grid grid-cols-3 gap-2 pt-2">
                <button onclick="closeModal()" class="p-3 rounded-xl bg-slate-200 text-slate-700 font-bold hover:bg-slate-300 transition text-xs">キャンセル</button>
                <button onclick="skipTask()" class="p-3 rounded-xl bg-amber-100 text-amber-800 font-bold hover:bg-amber-200 transition text-xs">見送り(スキップ)</button>
                <button id="complete-btn" onclick="confirmTask()" disabled class="p-3 rounded-xl bg-slate-200 text-slate-500 font-bold cursor-not-allowed transition text-xs">すべて完了</button>
            </div>
        </div>
    </div>

    <!-- A4印刷用プレビューモーダル -->
    <div id="print-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50 no-print">
        <div class="bg-white w-full max-w-2xl rounded-2xl p-6 space-y-4 shadow-2xl max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-lg text-slate-800">ワークスケジュール作業実施報告書</h3>
                <button onclick="closePrintPreview()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div id="print-report-area" class="bg-white p-6 rounded-xl border space-y-4 overflow-y-auto flex-1 text-slate-800 text-xs">
                <div class="text-center border-b pb-3 space-y-1">
                    <h2 class="text-base font-bold">ワークスケジュール作業実施報告書 兼 フィードバック</h2>
                    <p id="report-store-date" class="text-[10px] text-slate-500"></p>
                </div>
                <div class="grid grid-cols-2 gap-4 bg-slate-50 p-2.5 rounded-lg border">
                    <div><span class="font-bold text-slate-500">対象店舗・シフト:</span> <span id="report-shift-name" class="font-bold"></span></div>
                    <div><span class="font-bold text-slate-500">出力日時:</span> <span id="report-output-time"></span></div>
                    <div><span class="font-bold text-slate-500">1レジ担当:</span> <span id="report-r1-staff" class="font-bold text-blue-600"></span></div>
                    <div><span class="font-bold text-slate-500">2レジ担当:</span> <span id="report-r2-staff" class="font-bold text-emerald-600"></span></div>
                </div>
                <div class="space-y-3">
                    <div>
                        <h4 class="font-bold text-[11px] bg-blue-100 text-blue-800 px-2 py-1 rounded mb-1">1レジ 実施タスク分析</h4>
                        <div id="report-r1-tasks" class="space-y-1"></div>
                    </div>
                    <div>
                        <h4 class="font-bold text-[11px] bg-emerald-100 text-emerald-800 px-2 py-1 rounded mb-1">2レジ 実施タスク分析</h4>
                        <div id="report-r2-tasks" class="space-y-1"></div>
                    </div>
                </div>
                <div class="pt-6 border-t flex justify-between text-[10px] text-slate-400">
                    <p>管理者確認印: ___________________</p>
                    <p>ワークスケジュール管理システム</p>
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2 border-t">
                <button onclick="closePrintPreview()" class="px-4 py-2 bg-slate-200 text-slate-700 font-bold rounded-lg text-sm">キャンセル</button>
                <button onclick="window.print()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-sm flex items-center gap-1 shadow">
                    <i data-lucide="printer" class="w-4 h-4"></i> 印刷する
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const loadingTips = [
            "💡 豆知識: 接客の基本は『明るい声』と『笑顔』から！",
            "☕ 接客英語: 『温めますか？』⇒ 'Would you like that warmed?'",
            "✨ スタッフの皆さん、今日もワークスケジュールお疲れ様です！",
            "🏃‍♂️ データをクラウドへ猛ダッシュ中...",
            "🧹 ワンポイント: 商品の前面陳列（前出し）で売上アップ！",
            "🌍 多言語Tips: 『お会計〇〇円です』⇒ 'That will be 〇〇 yen.'",
            "🔥 フライヤー温度やホットフードの管理、お疲れ様です！"
        ];

        function showLoading() {
            const randomTip = loadingTips[Math.floor(Math.random() * loadingTips.length)];
            document.getElementById('loading-tip-box').innerText = randomTip;
            const overlay = document.getElementById('loading-overlay');
            overlay.style.display = 'flex';
            overlay.classList.remove('opacity-0', 'pointer-events-none');
        }

        function hideLoading() {
            const overlay = document.getElementById('loading-overlay');
            overlay.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => { overlay.style.display = 'none'; }, 300);
        }

        showLoading();

        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyaJTbew77-WVvluXD7OnQPa2TVhoFRPLzv3Bq3uopQUPTjhqTtdUIV4du5pmSzyUkFaA/exec";

        const currentStoreId = localStorage.getItem('ws_current_store_id') || "store_1";
        const storesMaster = JSON.parse(localStorage.getItem('ws_stores_master')) || [{ id: "store_1", name: "1号店" }, { id: "store_2", name: "2号店" }];
        const currentStore = storesMaster.find(s => s.id === currentStoreId) || storesMaster[0];
        
        document.getElementById('store-name-display').innerText = currentStore.name;
        document.getElementById('store-label').innerText = currentStore.name;

        let staffList = [];
        let taskMasterMap = {};
        let taskStandardTimes = {};
        let SHIFT_DATA = {};
        let currentShiftKey = "";
        let currentShift = null;

        const stateKey = `ws_portal_state_${currentStoreId}`;
        let state = JSON.parse(localStorage.getItem(stateKey)) || { 
            r1: [], r2: [], 
            r1Times: {}, r2Times: {}, 
            r1Skips: [], r2Skips: [], // スキップされたタスクを保持
            r1LastCompleteTime: Date.now(), 
            r2LastCompleteTime: Date.now(),
            r1StartTime: Date.now(), 
            r2StartTime: Date.now(),
            r1Staff: "未選択",
            r2Staff: "未選択",
            r1Hour: 8, 
            r2Hour: 8  
        }; 

        // スキッププロパティがない場合のフォールバック
        if (!state.r1Skips) state.r1Skips = [];
        if (!state.r2Skips) state.r2Skips = [];

        function saveLocalState() {
            localStorage.setItem(stateKey, JSON.stringify(state));
        }

        async function initPortal() {
            showLoading();
            try {
                const staffRes = await fetch(`${GAS_API_URL}?sheet=staff`);
                const staffData = await staffRes.json();
                staffList = Array.isArray(staffData) ? staffData.filter(s => !s.store || s.store === currentStore.name || s.store === "共通") : [];
                if (staffList.length === 0 && Array.isArray(staffData)) staffList = staffData;

                const taskRes = await fetch(`${GAS_API_URL}?sheet=tasks`);
                const taskData = await taskRes.json();
                if (Array.isArray(taskData)) {
                    taskData.forEach(t => { 
                        if (t && t.name) {
                            const tName = t.name.trim();
                            taskMasterMap[tName] = typeof t.subs === 'string' ? t.subs.split(',').filter(Boolean) : (t.subs || []); 
                            taskStandardTimes[tName] = Number(t.standard_sec) || 0; 
                        }
                    });
                }

                const sheetName = `shifts_${currentStoreId}`;
                const shiftRes = await fetch(`${GAS_API_URL}?sheet=${sheetName}`);
                const shiftDataJson = await shiftRes.json();

                if (Array.isArray(shiftDataJson) && shiftDataJson.length > 0) {
                    SHIFT_DATA = JSON.parse(shiftDataJson[0].data || "{}");
                }

                if (!SHIFT_DATA || Object.keys(SHIFT_DATA).length === 0) {
                    SHIFT_DATA = {
                        "s_morning": { 
                            name: `${currentStore.name} 朝シフト (8:00〜12:00)`, 
                            start: 8, 
                            end: 12, 
                            tasks: { 
                                r1: { 8: ["ポットのお湯確認補充"], 9: ["値引きシール貼り( )14"] }, 
                                r2: { 8: ["温度チェック★"], 10: ["チルド飲料品出し"] } 
                            } 
                        }
                    };
                }

                currentShiftKey = Object.keys(SHIFT_DATA)[0];
                currentShift = SHIFT_DATA[currentShiftKey];
                
                if (state.r1Hour === undefined || state.r1Hour < currentShift.start || state.r1Hour >= currentShift.end) {
                    state.r1Hour = currentShift.start;
                }
                if (state.r2Hour === undefined || state.r2Hour < currentShift.start || state.r2Hour >= currentShift.end) {
                    state.r2Hour = currentShift.start;
                }

            } catch (error) {
                console.error("ポータル初期化エラー:", error);
                SHIFT_DATA = {
                    "s1": { name: `${currentStore.name} 標準シフト (8:00〜12:00)`, start: 8, end: 12, tasks: { r1: { 8: ["ポットのお湯確認補充"] }, r2: { 8: ["温度チェック★"] } } }
                };
                currentShiftKey = Object.keys(SHIFT_DATA)[0];
                currentShift = SHIFT_DATA[currentShiftKey];
            }

            const shiftSelect = document.getElementById('shift-select');
            shiftSelect.innerHTML = Object.keys(SHIFT_DATA).map(k => `
                <option value="${k}">${SHIFT_DATA[k].name}</option>
            `).join('');

            hideLoading();
            document.getElementById('main-content').classList.remove('hidden');
            renderApp();
        }

        setInterval(() => {
            const now = new Date();
            document.getElementById('realtime-clock').innerText = now.toTimeString().split(' ')[0];

            updateRegTimer('r1', state.r1StartTime);
            updateRegTimer('r2', state.r2StartTime);
        }, 1000);

        function updateRegTimer(regKey, startTime) {
            const timerEl = document.getElementById(`${regKey}-timer`);
            if (timerEl) {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                timerEl.innerText = new Date(elapsed * 1000).toISOString().substr(11, 8);
            }
        }

        function resetShift() {
            currentShiftKey = document.getElementById('shift-select').value;
            currentShift = SHIFT_DATA[currentShiftKey];
            state.r1Hour = currentShift.start;
            state.r2Hour = currentShift.start;
            state.r1 = [];
            state.r2 = [];
            state.r1Skips = [];
            state.r2Skips = [];
            state.r1Times = {};
            state.r2Times = {};
            state.r1StartTime = Date.now();
            state.r2StartTime = Date.now();
            state.r1LastCompleteTime = Date.now();
            state.r2LastCompleteTime = Date.now();
            saveLocalState();
            renderApp();
        }

        function updateStaff(regKey, staffName) {
            if (regKey === 'r1') state.r1Staff = staffName;
            if (regKey === 'r2') state.r2Staff = staffName;
            saveLocalState();
        }

        function renderApp() {
            renderSection('r1', '1レジ担当者', state.r1Staff, state.r1Hour);
            renderSection('r2', '2レジ担当者', state.r2Staff, state.r2Hour);
            saveLocalState();
        }

        function renderSection(regKey, title, currentStaff, currentHour) {
            const container = document.getElementById(`${regKey}-area`);
            const regTasksByHour = currentShift.tasks[regKey] || {};
            
            const allTaskNames = [...new Set(Object.values(regTasksByHour).flat())];
            const currentTasks = regTasksByHour[currentHour] || [];
            const timesMap = regKey === 'r1' ? state.r1Times : state.r2Times;
            const completedList = regKey === 'r1' ? state.r1 : state.r2;
            const skippedList = regKey === 'r1' ? state.r1Skips : state.r2Skips;

            const startTime = regKey === 'r1' ? state.r1StartTime : state.r2StartTime;
            const initialElapsed = Math.floor((Date.now() - startTime) / 1000);
            const initialElapsedStr = new Date(initialElapsed * 1000).toISOString().substr(11, 8);

            const staffOptions = staffList.map(s => `
                <option value="${s.name}" ${s.name === currentStaff ? 'selected' : ''}>${s.name} (${s.store || '店舗未設定'})</option>
            `).join('');

            container.innerHTML = `
                <div class="flex flex-col gap-2 shrink-0 w-28">
                    ${allTaskNames.map(name => {
                        let dotColor = 'bg-slate-300';
                        if (completedList.includes(name)) dotColor = 'bg-emerald-500';
                        else if (skippedList.includes(name)) dotColor = 'bg-amber-400';

                        return `
                            <div class="flex items-center gap-2">
                                <div class="w-3 h-10 rounded-full ${dotColor}"></div>
                                <span class="text-[10px] font-bold text-slate-500 truncate" title="${name}">${name}</span>
                            </div>
                        `;
                    }).join('')}
                </div>
                
                <div class="flex-1 space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-slate-700 text-xl">${title}</h3>
                        <select onchange="updateStaff('${regKey}', this.value)" class="text-xs p-2 border rounded-lg font-bold bg-white text-slate-700 shadow-sm">
                            <option value="未選択">担当者を選択</option>
                            ${staffOptions}
                        </select>
                    </div>

                    <div class="p-4 bg-slate-900 rounded-xl text-white flex justify-between items-center">
                        <div>
                            <p class="text-xs text-slate-400">現在のフェーズ</p>
                            <p class="text-2xl font-bold font-mono">${currentHour}:00〜</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs text-slate-400">経過時間</p>
                            <p id="${regKey}-timer" class="text-xl font-bold font-mono text-emerald-400">${initialElapsedStr}</p>
                        </div>
                    </div>

                    ${currentTasks.length === 0 ? '<p class="text-xs text-slate-400 py-4">この時間の割当タスクはありません</p>' : ''}

                    ${currentTasks.map(name => {
                        const isCompleted = completedList.includes(name);
                        const isSkipped = skippedList.includes(name);
                        const durationSec = timesMap[name];
                        let statusDisplay = '';

                        if (isCompleted) {
                            const m = Math.floor(durationSec / 60);
                            const s = durationSec % 60;
                            statusDisplay = `<span class="text-xs font-mono bg-emerald-100 text-emerald-800 px-2 py-1 rounded">所要時間: ${m > 0 ? m + '分' : ''}${s}秒</span>`;
                        } else if (isSkipped) {
                            statusDisplay = `<span class="text-xs font-bold bg-amber-100 text-amber-800 px-2 py-1 rounded">見送り（未完了）</span>`;
                        }

                        let btnStyle = "bg-white border-slate-200 text-slate-800 hover:border-blue-400";
                        if (isCompleted) btnStyle = "bg-emerald-50 border-emerald-500 text-emerald-800";
                        if (isSkipped) btnStyle = "bg-amber-50 border-amber-400 text-amber-800";

                        return `
                            <button onclick="handleTaskClick('${regKey}', '${name}')" 
                                class="w-full p-4 rounded-xl border-2 font-bold transition flex items-center justify-between ${btnStyle}">
                                <span>${name}</span>
                                <div class="flex items-center gap-2">
                                    ${statusDisplay}
                                    ${isCompleted ? '<i data-lucide="check-circle" class="text-emerald-600"></i>' : ''}
                                    ${isSkipped ? '<i data-lucide="alert-circle" class="text-amber-600"></i>' : ''}
                                </div>
                            </button>
                        `;
                    }).join('')}

                    ${currentTasks.length > 0 && currentTasks.every(name => completedList.includes(name) || skippedList.includes(name)) ? 
                        `<button onclick="nextHour('${regKey}')" class="w-full p-4 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:bg-blue-700 animate-bounce">次の時間へ進む →</button>` 
                        : ''}
                </div>
            `;
            lucide.createIcons();
        }

        function handleTaskClick(regKey, taskName) {
            const completedList = regKey === 'r1' ? state.r1 : state.r2;
            const skippedList = regKey === 'r1' ? state.r1Skips : state.r2Skips;
            
            // 既に完了またはスキップ済みの場合は再編集用にモーダルを開くか、そのままにする
            const trimmedName = taskName.trim();
            let subs = taskMasterMap[trimmedName];
            if (!subs || !Array.isArray(subs) || subs.length === 0) {
                subs = ["実施確認", "完了確認"];
            }
            
            state.activeTask = taskName;
            state.activeReg = regKey;
            
            const list = document.getElementById('subtask-list');
            const btn = document.getElementById('complete-btn');
            
            document.getElementById('modal-title').innerText = taskName;
            list.innerHTML = subs.map(s => `
                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg cursor-pointer">
                    <input type="checkbox" onchange="checkSubtasks()" class="sub-checkbox w-5 h-5">
                    <span>${s}</span>
                </label>
            `).join('');
            
            btn.disabled = true;
            btn.className = "p-3 rounded-xl bg-slate-200 text-slate-500 font-bold cursor-not-allowed transition text-xs";
            document.getElementById('task-modal').classList.remove('hidden');
        }

        function checkSubtasks() {
            const boxes = document.querySelectorAll('.sub-checkbox');
            const allChecked = boxes.length > 0 && Array.from(boxes).every(b => b.checked);
            const btn = document.getElementById('complete-btn');
            if (allChecked) {
                btn.disabled = false;
                btn.className = "p-3 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700 transition text-xs";
            } else {
                btn.disabled = true;
                btn.className = "p-3 rounded-xl bg-slate-200 text-slate-500 font-bold cursor-not-allowed transition text-xs";
            }
        }

        function closeModal() {
            document.getElementById('task-modal').classList.add('hidden');
        }

        // タスクスキップ（見送り）処理
        async function skipTask() {
            const regKey = state.activeReg;
            const taskName = state.activeTask;
            const completedList = regKey === 'r1' ? state.r1 : state.r2;
            const skippedList = regKey === 'r1' ? state.r1Skips : state.r2Skips;

            // 既に完了リストにあれば削除
            const cIdx = completedList.indexOf(taskName);
            if (cIdx > -1) completedList.splice(cIdx, 1);

            if (!skippedList.includes(taskName)) {
                skippedList.push(taskName);
                saveLocalState();

                // ログにもスキップとして送信
                const staffName = regKey === 'r1' ? state.r1Staff : state.r2Staff;
                const currentHour = regKey === 'r1' ? state.r1Hour : state.r2Hour;
                const logData = {
                    sheet: "logs",
                    action: "append",
                    row: {
                        timestamp: new Date().toLocaleString(),
                        store: currentStore.name,
                        shift: currentShift.name,
                        reg: regKey === 'r1' ? '1レジ' : '2レジ',
                        staff: staffName,
                        task: taskName + " (見送り・未完了)",
                        hour: currentHour + "時台",
                        duration_sec: 0
                    }
                };

                try {
                    fetch(GAS_API_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(logData)
                    });
                } catch (err) {
                    console.error("スキップログ送信エラー:", err);
                }
            }

            closeModal();
            renderApp();
        }

        async function confirmTask() {
            const regKey = state.activeReg;
            const taskName = state.activeTask;
            const completedList = regKey === 'r1' ? state.r1 : state.r2;
            const skippedList = regKey === 'r1' ? state.r1Skips : state.r2Skips;

            // スキップリストにあれば削除
            const sIdx = skippedList.indexOf(taskName);
            if (sIdx > -1) skippedList.splice(sIdx, 1);

            if (!completedList.includes(taskName)) {
                const nowTime = Date.now();
                const lastTime = regKey === 'r1' ? state.r1LastCompleteTime : state.r2LastCompleteTime;
                const durationSec = Math.floor((nowTime - lastTime) / 1000);
                const currentHour = (regKey === 'r1') ? state.r1Hour : state.r2Hour;

                if (regKey === 'r1') {
                    state.r1Times[taskName] = durationSec;
                    state.r1LastCompleteTime = nowTime;
                } else {
                    state.r2Times[taskName] = durationSec;
                    state.r2LastCompleteTime = nowTime;
                }

                completedList.push(taskName);
                saveLocalState();

                const staffName = regKey === 'r1' ? state.r1Staff : state.r2Staff;
                const logData = {
                    sheet: "logs",
                    action: "append",
                    row: {
                        timestamp: new Date().toLocaleString(),
                        store: currentStore.name,
                        shift: currentShift.name,
                        reg: regKey === 'r1' ? '1レジ' : '2レジ',
                        staff: staffName,
                        task: taskName,
                        hour: currentHour + "時台",
                        duration_sec: durationSec
                    }
                };

                try {
                    fetch(GAS_API_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(logData)
                    });
                } catch (err) {
                    console.error("ログ送信エラー:", err);
                }
            }

            closeModal();
            renderApp();
        }

        function nextHour(regKey) {
            const targetHour = (regKey === 'r1') ? state.r1Hour : state.r2Hour;

            if (targetHour < currentShift.end - 1) {
                if (regKey === 'r1') {
                    state.r1Hour += 1;
                    state.r1StartTime = Date.now();
                    state.r1LastCompleteTime = Date.now();
                } else {
                    state.r2Hour += 1;
                    state.r2StartTime = Date.now();
                    state.r2LastCompleteTime = Date.now();
                }
                saveLocalState();
                renderApp();
            } else {
                alert(`${regKey === 'r1' ? '1レジ' : '2レジ'}はこのシフトの最終時間です！お疲れ様でした。`);
            }
        }

        function openPrintPreview() {
            document.getElementById('report-store-date').innerText = `店舗: ${currentStore.name} ／ 実施日: ${new Date().toLocaleDateString()}`;
            document.getElementById('report-shift-name').innerText = currentShift.name;
            document.getElementById('report-output-time').innerText = new Date().toLocaleString();
            document.getElementById('report-r1-staff').innerText = state.r1Staff;
            document.getElementById('report-r2-staff').innerText = state.r2Staff;

            renderReportTasks('r1', currentShift.tasks.r1, state.r1, state.r1Skips, state.r1Times, 'report-r1-tasks');
            renderReportTasks('r2', currentShift.tasks.r2, state.r2, state.r2Skips, state.r2Times, 'report-r2-tasks');

            document.getElementById('print-modal').classList.remove('hidden');
        }

        function renderReportTasks(regKey, regTasksByHour, completedList, skippedList, timesMap, containerId) {
            const container = document.getElementById(containerId);
            const allTasks = [...new Set(Object.values(regTasksByHour || {}).flat())];

            if (allTasks.length === 0) {
                container.innerHTML = '<p class="text-[10px] text-slate-400">タスクなし</p>';
                return;
            }

            container.innerHTML = allTasks.map(name => {
                const isDone = completedList.includes(name);
                const isSkipped = skippedList.includes(name);
                const actualSec = timesMap[name];
                const standardSec = taskStandardTimes[name] || 0;

                let statusStr = '未実施';
                let feedbackHtml = '';

                if (isDone) {
                    statusStr = `実測: ${Math.floor(actualSec/60)}分${actualSec%60}秒`;
                    if (standardSec > 0 && actualSec !== undefined) {
                        const diffSec = actualSec - standardSec;
                        const diffMin = Math.abs(Math.floor(diffSec / 60));
                        const diffS = Math.abs(diffSec % 60);
                        const diffStr = diffMin > 0 ? `${diffMin}分${diffS}秒` : `${diffS}秒`;

                        if (actualSec < standardSec * 0.3 && standardSec >= 60) {
                            feedbackHtml = `<div class="text-red-600 font-bold bg-red-50 px-1 rounded text-[10px]">⚠️ 規定より著しく短いです。手順の抜け漏れを確認してください。</div>`;
                        } else if (diffSec > 60) {
                            feedbackHtml = `<div class="text-amber-600 text-[10px]">標準より ${diffStr} 遅延</div>`;
                        } else if (diffSec < -60) {
                            feedbackHtml = `<div class="text-blue-600 text-[10px]">標準より ${diffStr} スムーズ</div>`;
                        } else {
                            feedbackHtml = `<div class="text-emerald-600 text-[10px]">標準的ペース</div>`;
                        }
                    }
                } else if (isSkipped) {
                    statusStr = `<span class="text-amber-600 font-bold">見送り（未完了）</span>`;
                }

                let iconSymbol = 'ー';
                if (isDone) iconSymbol = '✓';
                if (isSkipped) iconSymbol = '⚠️';

                return `
                    <div class="flex flex-col border-b border-slate-100 py-1 text-[11px]">
                        <div class="flex justify-between items-center">
                            <span class="font-bold ${isDone ? 'text-slate-800' : isSkipped ? 'text-amber-700' : 'text-slate-400'}">${iconSymbol} ${name}</span>
                            <span class="font-mono text-slate-500">${statusStr}</span>
                        </div>
                        ${feedbackHtml}
                    </div>
                `;
            }).join('');
        }

        function closePrintPreview() {
            document.getElementById('print-modal').classList.add('hidden');
        }

        function safeNavigate(url) {
            saveLocalState();
            window.location.href = url;
        }

        window.addEventListener('beforeunload', () => {
            saveLocalState();
        });

        initPortal();
    </script>
</body>
</html>
