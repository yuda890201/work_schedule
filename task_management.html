<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>タスク管理マスター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto space-y-6">
        <div class="flex justify-between items-center">
            <h2 class="text-2xl font-bold text-slate-800">タスク管理マスター</h2>
            <button onclick="window.location.href='index.html'" class="text-slate-500 hover:text-slate-900">戻る</button>
        </div>

        <!-- 絞り込みフィルター -->
        <div class="bg-white p-4 rounded-xl shadow-sm border flex gap-2 overflow-x-auto">
            <button onclick="filterTasks('すべて')" class="px-3 py-1 bg-slate-200 rounded-full text-sm font-bold">すべて</button>
            <div id="filter-buttons" class="flex gap-2"></div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border p-6">
            <button onclick="addTask()" class="w-full py-3 border-2 border-dashed border-slate-300 rounded-lg text-slate-500 font-bold hover:border-blue-400 hover:text-blue-500 mb-6 flex items-center justify-center gap-2">
                <i data-lucide="plus"></i> 新しいタスクを追加
            </button>
            <div id="task-list" class="space-y-4"></div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let currentFilter = 'すべて';
        let tasks = JSON.parse(localStorage.getItem('ws_tasks_master')) || [
            { id: 1, name: "レジ回りメンテナンス", tag: "レジ", subs: ["レジ拭き", "釣銭確認"] }
        ];

        function filterTasks(tag) {
            currentFilter = tag;
            render();
        }

        function render() {
            // タグ一覧の生成
            const tags = ['すべて', ...new Set(tasks.map(t => t.tag || 'その他'))];
            const filterContainer = document.getElementById('filter-buttons');
            filterContainer.innerHTML = tags.filter(t => t !== 'すべて').map(t => `
                <button onclick="filterTasks('${t}')" class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm font-bold">${t}</button>
            `).join('');

            // タスクの絞り込み表示
            const filteredTasks = currentFilter === 'すべて' ? tasks : tasks.filter(t => (t.tag || 'その他') === currentFilter);
            const list = document.getElementById('task-list');
            
            list.innerHTML = filteredTasks.map(t => `
                <div class="border rounded-lg p-4 space-y-3 bg-slate-50">
                    <div class="flex gap-2 items-center">
                        <input value="${t.name}" onchange="updateTask(${t.id}, 'name', this.value)" class="font-bold text-lg flex-1 bg-transparent border-b border-transparent focus:border-blue-500 outline-none">
                        <input list="tag-suggestions" value="${t.tag || ''}" onchange="updateTask(${t.id}, 'tag', this.value)" class="w-24 text-xs font-bold text-blue-600 bg-white border px-2 py-1 rounded border-blue-200 outline-none">
                        <datalist id="tag-suggestions">
                            ${tags.filter(t => t !== 'すべて').map(t => `<option value="${t}">`).join('')}
                        </datalist>
                        <button onclick="deleteTask(${t.id})" class="text-slate-400 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                    <div class="ml-6 space-y-2">
                        ${t.subs.map((s, idx) => `
                            <div class="flex gap-2 text-sm">
                                <span class="text-slate-400">•</span>
                                <input value="${s}" onchange="updateSub(${t.id}, ${idx}, this.value)" class="flex-1 bg-transparent border-b border-transparent focus:border-blue-500 outline-none">
                                <button onclick="deleteSub(${t.id}, ${idx})" class="text-slate-300 hover:text-red-500"><i data-lucide="x" class="w-3 h-3"></i></button>
                            </div>
                        `).join('')}
                        <button onclick="addSub(${t.id})" class="text-xs text-blue-600 font-bold flex items-center gap-1 mt-2">
                            <i data-lucide="plus" class="w-3 h-3"></i> サブタスク追加
                        </button>
                    </div>
                </div>
            `).join('');
            save();
            lucide.createIcons();
        }

        function addTask() {
            tasks.push({ id: Date.now(), name: "新規タスク", tag: "その他", subs: ["詳細項目1"] });
            render();
        }

        function updateTask(id, key, val) { tasks.find(t => t.id === id)[key] = val; render(); }
        function updateSub(id, sIdx, val) { tasks.find(t => t.id === id).subs[sIdx] = val; save(); }
        function deleteTask(id) { tasks = tasks.filter(t => t.id !== id); render(); }
        function addSub(id) { tasks.find(t => t.id === id).subs.push("新規項目"); render(); }
        function deleteSub(id, sIdx) { tasks.find(t => t.id === id).subs.splice(sIdx, 1); render(); }
        function save() { localStorage.setItem('ws_tasks_master', JSON.stringify(tasks)); }

        render();
    </script>
</body>
</html>
```eof
