<body class="bg-slate-100 min-h-screen p-4 md:p-8">

            <button onclick="window.location.href='index.html'" class="text-slate-500 hover:text-slate-900 font-bold">戻る</button>

        <!-- 絞り込みフィルター -->

            <button onclick="filterTasks('すべて')" class="px-3 py-1 bg-slate-200 rounded-full text-sm font-bold">すべて</button>
            <div id="filter-buttons" class="flex gap-2"></div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border p-6">
            <button onclick="addTask()" class="w-full py-3 border-2 border-dashed border-slate-300 rounded-lg text-slate-500 font-bold hover:border-blue-400 hover:text-blue-500 mb-6 flex items-center justify-center gap-2">
                <i data-lucide="plus"></i> 新しいタスクを追加
            </button>
            <div id="task-list" class="space-y-4"></div>
        </div>
    </div>

        // 初期データとしてご提示いただいた全タスクリストを組み込んでいます

            {tag: "発注", name: "新商品導入", subs: []}, {tag: "発注", name: "事前発注", subs: []}, {tag: "発注", name: "スキャン発注", subs: []}, {tag: "発注", name: "SHOPS発注", subs: []},

            {tag: "定時業務", name: "コピー入金", subs: []}, {tag: "定時業務", name: "レシート・帳票整理", subs: []}, {tag: "定時業務", name: "レジ精算", subs: []}, {tag: "定時業務", name: "ストコン精算", subs: []}, {tag: "定時業務", name: "スタンプ日付変更", subs: []}, {tag: "定時業務", name: "ホット飲料ラベラ日付変更", subs: []}, {tag: "定時業務", name: "店控えスキャン", subs: []}, {tag: "定時業務", name: "納品用台車準備", subs: []}, {tag: "定時業務", name: "切手ファイル整理", subs: []}, {tag: "定時業務", name: "募金入金", subs: []},
            {tag: "前出しフェイスアップ", name: "米飯前だし", subs: []}, {tag: "前出しフェイスアップ", name: "パン前だし", subs: []}, {tag: "前出しフェイスアップ", name: "デザート・半生菓子前だし", subs: []}, {tag: "前出しフェイスアップ", name: "サンドイッチ・調理麺前だし", subs: []}, {tag: "前出しフェイスアップ", name: "サラダ・パスタ前だし", subs: []}, {tag: "前出しフェイスアップ", name: "チョコレート売り場前だし", subs: []}, {tag: "前出しフェイスアップ", name: "スナック菓子売り場前だし", subs: []}, {tag: "前出しフェイスアップ", name: "カップ麺売り場前出し", subs: []}, {tag: "前出しフェイスアップ", name: "スープ売り場前だし", subs: []}, {tag: "前出しフェイスアップ", name: "日用品前だし", subs: []},
            {tag: "品出し", name: "ホット飲料品出し", subs: []}, {tag: "品出し", name: "栄養ドリンク品出し", subs: []}, {tag: "品出し", name: "チルド飲料品出し", subs: []}, {tag: "品出し", name: "アイスカップ補充", subs: []}, {tag: "品出し", name: "水補充", subs: []}, {tag: "品出し", name: "常温水補充", subs: []},

            {tag: "納品", name: "山崎パン1便", subs: []}, {tag: "納品", name: "山崎パン2便", subs: []}, {tag: "納品", name: "センター1便", subs: []}, {tag: "納品", name: "センター2便", subs: []}, {tag: "納品", name: "用度品発注カードつける", subs: []}, {tag: "納品", name: "センター3便", subs: []}, {tag: "納品", name: "たばこ納品検品", subs: []}, {tag: "納品", name: "たばこ品切れチェック", subs: []}, {tag: "納品", name: "冷凍便納品(売り場)", subs: []}, {tag: "納品", name: "冷凍便納品(カウンター内)", subs: []}, {tag: "納品", name: "新聞納品", subs: []}, {tag: "納品", name: "雑誌納品", subs: []}, {tag: "納品", name: "常温便納品(売り場)", subs: []}, {tag: "納品", name: "お菓子開封作業(カウンター内)", subs: []}, {tag: "納品", name: "単品カードチェック", subs: []}, {tag: "納品", name: "陳列位置登録", subs: []},
            {tag: "週一業務", name: "Pエンド展開", subs: []}, {tag: "週一業務", name: "Pエンド撤去", subs: []}, {tag: "週一業務", name: "アイキャッチPOP撤去", subs: []}, {tag: "週一業務", name: "アイキャッチPOPつける", subs: []}, {tag: "週一業務", name: "販促物撤去", subs: []}, {tag: "週一業務", name: "販促物撤去ダブルチェック", subs: []}, {tag: "週一業務", name: "販促物つける", subs: []}, {tag: "週一業務", name: "販促物つけるダブルチェック", subs: []}, {tag: "週一業務", name: "クーポン対象商品切り抜き", subs: []}, {tag: "週一業務", name: "販促物仕分け", subs: []},
            {tag: "整理整頓", name: "スタッフドリンク整理", subs: []}, {tag: "整理整頓", name: "バックカウンター整理整頓", subs: []},
            {tag: "清掃", name: "トイレチェック", subs: []}, {tag: "清掃", name: "トイレ清掃", subs: []}, {tag: "清掃", name: "床清掃", subs: []}, {tag: "清掃", name: "FF什器拭き掃除", subs: []}, {tag: "清掃", name: "ホッターズ什器清掃", subs: []}, {tag: "清掃", name: "常温什器清掃", subs: []}, {tag: "清掃", name: "スチーマー什器清掃", subs: []}, {tag: "清掃", name: "コーヒーマシンカス捨て", subs: []}, {tag: "清掃", name: "コーヒーマシン清掃", subs: []}, {tag: "清掃", name: "電子レンジ清掃", subs: []}, {tag: "清掃", name: "レジカウンター清掃", subs: []}, {tag: "清掃", name: "ゴミ出し", subs: []}, {tag: "清掃", name: "かご清掃", subs: []}, {tag: "清掃", name: "フィルター清掃", subs: []}, {tag: "清掃", name: "ゴンドラ清掃", subs: []}, {tag: "清掃", name: "たばこ棚清掃", subs: []}, {tag: "清掃", name: "ATM・コピー機清掃", subs: []}, {tag: "清掃", name: "フライヤー清掃", subs: []}, {tag: "清掃", name: "フライヤー清掃周辺清掃", subs: []}, {tag: "清掃", name: "換気扇清掃", subs: []}, {tag: "清掃", name: "駐車場清掃 (ゴミ拾 い)", subs: []}
        ];

        // 初回ロード時、もしローカルストレージにデータがなければ自動でIDを付与してセットする
        let tasks = JSON.parse(localStorage.getItem('ws_tasks_master'));
        if (!tasks || tasks.length <= 1) {
            tasks = initialTasks.map((t, index) => ({ id: Date.now() + index, ...t }));
            localStorage.setItem('ws_tasks_master', JSON.stringify(tasks));
        }

        function filterTasks(tag) {
            currentFilter = tag;
            render();
        }

        function render() {
            // タグ一覧の生成
            const tags = ['すべて', ...new Set(tasks.map(t => t.tag || 'その他'))];
            const filterContainer = document.getElementById('filter-buttons');
            filterContainer.innerHTML = tags.filter(t => t !== 'すべて').map(t => `
                <button onclick="filterTasks('${t}')" class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm font-bold whitespace-nowrap">${t}</button>
            `).join('');

            // タスクの絞り込み表示
            const filteredTasks = currentFilter === 'すべて' ? tasks : tasks.filter(t => (t.tag || 'その他') === currentFilter);
            const list = document.getElementById('task-list');
            
            list.innerHTML = filteredTasks.map(t => `
                <div class="border rounded-lg p-4 space-y-3 bg-slate-50">
                    <div class="flex gap-2 items-center">
                        <input value="${t.name}" onchange="updateTask(${t.id}, 'name', this.value)" class="font-bold text-lg flex-1 bg-transparent border-b border-transparent focus:border-blue-500 outline-none">
                        <input list="tag-suggestions" value="${t.tag || ''}" onchange="updateTask(${t.id}, 'tag', this.value)" class="w-28 text-xs font-bold text-blue-600 bg-white border px-2 py-1 rounded border-blue-200 outline-none">
                        <datalist id="tag-suggestions">
                            ${tags.filter(tag => tag !== 'すべて').map(tag => `<option value="${tag}">`).join('')}
                        </datalist>
                        <button onclick="deleteTask(${t.id})" class="text-slate-400 hover:text-red-500 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                    <div class="ml-6 space-y-2">
                        ${t.subs.map((s, idx) => `
                            <div class="flex gap-2 text-sm items-center">
                                <span class="text-slate-400">•</span>
                                <input value="${s}" onchange="updateSub(${t.id}, ${idx}, this.value)" class="flex-1 bg-transparent border-b border-transparent focus:border-blue-500 outline-none">
                                <button onclick="deleteSub(${t.id}, ${idx})" class="text-slate-300 hover:text-red-500 p-1"><i data-lucide="x" class="w-3 h-3"></i></button>
                            </div>
                        `).join('')}
                        <button onclick="addSub(${t.id})" class="text-xs text-blue-600 font-bold flex items-center gap-1 mt-2">
                            <i data-lucide="plus" class="w-3 h-3"></i> サブタスク追加
                        </button>
                    </div>
                </div>
            `).join('');
            save();
            lucide.createIcons();
        }

        function addTask() {
            tasks.push({ id: Date.now(), name: "新規タスク", tag: "その他", subs: ["詳細項目1"] });
            render();
        }

        function updateTask(id, key, val) { tasks.find(t => t.id === id)[key] = val; render(); }
        function updateSub(id, sIdx, val) { tasks.find(t => t.id === id).subs[sIdx] = val; save(); }
        function deleteTask(id) { tasks = tasks.filter(t => t.id !== id); render(); }
        function addSub(id) { tasks.find(t => t.id === id).subs.push("新規項目"); render(); }
        function deleteSub(id, sIdx) { tasks.find(t => t.id === id).subs.splice(sIdx, 1); render(); }
        function save() { localStorage.setItem('ws_tasks_master', JSON.stringify(tasks)); }

        render();
    </script>
</body>
</html>
